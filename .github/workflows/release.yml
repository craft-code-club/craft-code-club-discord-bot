name: 'Release'


on:
  workflow_dispatch:

  push:
    branches:
      - main

    # paths:
    #   - "src/**"


permissions: {}


jobs:
  release-version:
    name: "Release new version"
    runs-on: 'ubuntu-latest'
    permissions:
      contents: write

    steps:
    - name: "Checkout"
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: "Semantic Release"
      id: 'semantic-release'
      uses: cycjimmy/semantic-release-action@d9bf53a078bd2f86aaffaec796dbb3d28f1b6f34
      with:
        semantic_version: 24.2.7
        extra_plugins: |
          @semantic-release/changelog
          @semantic-release/git
      env:
        GH_TOKEN: ${{ secrets.GH_TOKEN }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: "New version"
      run: |
        echo "Published new version: ${{ steps.semantic-release.outputs.new_release_published }}"
        echo "New version: ${{ steps.semantic-release.outputs.new_release_version }}"
