name: Docker Build Test


on:
  workflow_dispatch:

  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main


permissions: {}


env:
  IMAGE_NAME: ${{ github.repository_owner }}/${{ github.event.repository.name }}/cicd-test-build-image:validation-${{ github.run_number }}


jobs:
  test-docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was created
        run: |
          docker images
          if ! docker images --format "{{.Repository}}:{{.Tag}}" | grep -q "${{ env.IMAGE_NAME }}"; then
            echo "Error: Docker image was not created successfully"
            exit 1
          fi
          echo "Docker image verified successfully"
