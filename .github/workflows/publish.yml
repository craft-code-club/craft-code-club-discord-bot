name: 'Publish'

# Builds the Azure Functions package and deploys it to the Flex Consumption
# function app provisioned by infra/ (see .github/workflows/infra.yml).
#
# The bot no longer ships as a Docker image: there is no gateway process to keep
# running, so there is nothing to put in a container. The whole app is the zip
# produced here.

on:
  workflow_dispatch:

  release:
    types: [created]


permissions: {}


concurrency:
  group: ci-${{ github.repository }}
  cancel-in-progress: true


env:
  PYTHON_VERSION: '3.12'
  FUNCTION_APP_NAME: 'func-c3-discord-bot-discord-bot'
  RESOURCE_GROUP: 'rg-craft-code-club'


jobs:
  build:
    name: 'Build Functions package'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write

    steps:
    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: 'Resolve version'
      id: version
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          VERSION="${{ github.event.release.tag_name }}"
        else
          VERSION=$(gh release list --repo ${{ github.repository }} --limit 1 --json tagName --jq '.[0].tagName')-${{ github.run_number }}
        fi

        if [ -z "$VERSION" ] || [ "$VERSION" == "null-${{ github.run_number }}" ]; then
          echo "Unable to resolve a release-based version. Ensure at least one release exists."
          exit 1
        fi

        echo "version=$VERSION" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ github.token }}

    - name: 'Set up Python'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: 'Install dependencies'
      run: pip install -r src/requirements.txt

    - name: 'Run tests'
      run: python -m unittest discover -s tests -v

    - name: 'Stamp the version into the package'
      run: |
        echo "${{ steps.version.outputs.version }}" > src/VERSION
        echo "Packaging version ${{ steps.version.outputs.version }}"

    - name: 'Create the deployment package'
      run: |
        cd src
        zip -r ../functions-package.zip . \
          -x '*.pyc' -x '__pycache__/*' -x '*/__pycache__/*' \
          -x 'local.settings.json' -x 'local.settings.json.example'

    - name: 'Upload artifact'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: functions-package
        path: functions-package.zip
        retention-days: 1


  publish-app:
    name: 'Publish App'
    runs-on: ubuntu-latest
    environment: PROD
    needs: build
    timeout-minutes: 20
    permissions:
      actions: read

    steps:
    - name: 'Download artifact'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: functions-package

    - name: 'Login to Azure'
      uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
      with:
        creds: |
          {
            "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
            "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
            "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
            "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
          }

    - name: 'Deploy to the function app'
      uses: Azure/functions-action@c5060b3b8bb1ebbcb531abd00c822ecbaa8ea656 # v1.5.7
      with:
        app-name: ${{ env.FUNCTION_APP_NAME }}
        package: functions-package.zip
        # Flex Consumption restores dependencies on the platform from the
        # requirements.txt inside the package.
        remote-build: true

    - name: 'Verify the deployment'
      run: |
        az functionapp function list \
          --name ${{ env.FUNCTION_APP_NAME }} \
          --resource-group ${{ env.RESOURCE_GROUP }} \
          --query "[].{name:name, disabled:isDisabled}" \
          --output table

    - name: 'Azure logout'
      if: always()
      uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3.0.0
      with:
        inlineScript: |
          az logout
          az cache purge
          az account clear


  register-commands:
    name: 'Register slash commands'
    runs-on: ubuntu-latest
    environment: PROD
    needs: publish-app
    timeout-minutes: 5

    steps:
    - name: 'Checkout'
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: 'Set up Python'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    # A bulk overwrite: the command set in src/commands_catalog.py replaces
    # whatever Discord currently has, so this is safe to re-run on every release.
    - name: 'Register commands with Discord'
      env:
        DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
        DISCORD_API_TOKEN: ${{ secrets.DISCORD_API_TOKEN }}
        DISCORD_GUILD_ID: ${{ vars.DISCORD_GUILD_ID }}
      run: python scripts/register_commands.py
