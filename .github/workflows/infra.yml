name: 'Infra'

# Provisions the Azure infrastructure in infra/ with Pulumi (Storage + Container App env + app).
#
# NOTE: deployment is intentionally MANUAL for now (workflow_dispatch only). The automatic
# push trigger below is commented out and will be enabled in a follow-up PR, once the Pulumi
# stack + secrets are set up and the resources have been imported/created.
on:
  workflow_dispatch:

  # --- Enable in the follow-up PR ---
  # push:
  #   branches: [main]
  #   paths:
  #     - 'infra/**'
  #     - '.github/workflows/infra.yml'

permissions:
  contents: read

env:
  PULUMI_STACK: ${{ vars.PULUMI_STACK || 'discord-bot' }}

jobs:
  pulumi:
    name: 'Pulumi up'
    runs-on: ubuntu-latest
    # The AZURE_* service-principal secrets live on the PROD environment (same one publish.yml
    # deploys to), so the job must declare it to see them.
    environment: PROD
    env:
      # Pulumi's azure-native provider authenticates via these ARM_* vars (service principal,
      # the same credentials publish.yml already uses).
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      # The repo secret is named PULUMI_TOKEN; the Pulumi CLI reads PULUMI_ACCESS_TOKEN.
      PULUMI_ACCESS_TOKEN: ${{ secrets.PULUMI_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7

      - name: 'Install IaC deps'
        working-directory: infra
        run: npm ci

      - name: 'Pulumi up'
        working-directory: infra
        env:
# Non-secret config — index.js reads these via process.env. Some have defaults (PROJECT_NAME, LOCATION, RESOURCE_GROUP_NAME, LOG_LEVEL); others are required (IMAGE + channel/forum IDs).
# Sourced from repo/environment "vars", not secrets.
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          LOCATION: ${{ vars.LOCATION }}
          RESOURCE_GROUP_NAME: ${{ vars.RESOURCE_GROUP_NAME }}
          IMAGE: ${{ vars.IMAGE }}
          LOG_LEVEL: ${{ vars.LOG_LEVEL }}
          COMMUNITY_EVENTS_CHANNEL_ID: ${{ vars.COMMUNITY_EVENTS_CHANNEL_ID }}
          SAY_HI_CHANNEL: ${{ vars.SAY_HI_CHANNEL }}
          LOGS_CHANNEL_ID: ${{ vars.LOGS_CHANNEL_ID }}
          WELCOME_MESSAGE_ENABLED: ${{ vars.WELCOME_MESSAGE_ENABLED }}
          WELCOME_CHANNEL_ID: ${{ vars.WELCOME_CHANNEL_ID }}
          ADMIN_JOIN_NOTIFICATION_ENABLED: ${{ vars.ADMIN_JOIN_NOTIFICATION_ENABLED }}
          ADMIN_JOIN_NOTIFICATION_CHANNEL_ID: ${{ vars.ADMIN_JOIN_NOTIFICATION_CHANNEL_ID }}
          # Bot secrets — scoped to ONLY this step (least privilege), not the whole job. index.js reads
          # them via process.env; all of these (Discord) are required.
          DISCORD_API_TOKEN: ${{ secrets.DISCORD_API_TOKEN }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID }}
          DISCORD_PUBLIC_KEY: ${{ secrets.DISCORD_PUBLIC_KEY }}
        run: |
          pulumi stack select "$PULUMI_STACK"
          pulumi up --yes --skip-preview
