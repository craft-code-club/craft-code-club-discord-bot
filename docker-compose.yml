# Local development only.
#
# The bot itself is no longer a container — it is an Azure Functions app, run
# locally with the Azure Functions Core Tools (`func start` in ./src, or the
# "func: host start" VS Code task). This file provides Azurite, the storage
# emulator that backs the CommunityEvents/BotState tables and the discord-work
# queue while developing.
networks:
  demo:
    driver: bridge

services:

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:3.35.0 # https://github.com/Azure/Azurite
    container_name: azurite
    restart: always
    # The Functions host needs blob and queue services too, not just tables.
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0"
    ports:
      - 10000:10000 # Blob service
      - 10001:10001 # Queue service
      - 10002:10002 # Table service
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider --server-response http://0.0.0.0:10002/devstoreaccount1 2>&1 | grep -q 'HTTP.*[2-4][0-9][0-9]'"]
      interval: 15s
      timeout: 3s
      retries: 20
    networks:
      - demo
